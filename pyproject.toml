[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wurubururu"
version = "0.1.0"
description = "딴지일보 우르부르(WebToy, 2001)를 macOS / Windows 11에서 되살리는 알림 단말 프로그램"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyusb>=1.2"]

[project.optional-dependencies]
google = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.1"]
tray = ["pystray>=0.19", "pillow>=10"]
all = ["wurubururu[google,tray]"]
dev = ["pytest>=8"]

[project.scripts]
wurubururu = "wurubururu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wurubururu = ["default_config.toml", "web.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
